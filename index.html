<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FlouLox Studios</title>
<meta name="description" content="FlouLox Studios makes Scrap Surge, a space salvage game for phones.">
<style>
  :root { --bg: #070b1a; --card: #10162e; --ink: #e8eeff; --dim: #9aa6c8; --accent: #40e0ff; --line: #26304f; }
  * { box-sizing: border-box; }
  body { margin: 0; background: radial-gradient(ellipse at 30% 0%, #16204a 0%, var(--bg) 60%) fixed; color: var(--ink); font: 16px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 48px 16px 64px; }
  .studio { font-size: 13px; letter-spacing: 0.3em; text-transform: uppercase; color: var(--dim); margin: 0 0 32px; }
  .game { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 24px; text-align: center; }
  .game img { width: 100%; max-width: 440px; height: auto; }
  .game p { color: var(--dim); margin: 12px 0 20px; }
  .links { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
  .links a { color: var(--ink); text-decoration: none; border: 1px solid var(--line); border-radius: 999px; padding: 8px 16px; }
  .links a:hover { border-color: var(--accent); color: var(--accent); }
  footer { margin-top: 32px; color: var(--dim); font-size: 14px; text-align: center; }
  footer a { color: var(--accent); }
</style>
</head>
<body>
<main>
  <p class="studio">FlouLox Studios</p>
  <section class="game">
    <img src="scrap-surge/logo.png" alt="Scrap Surge" width="720" height="412">
    <p>Salvage debris, upgrade your ship and take on the guardians of deep space.</p>
    <div class="links">
      <a href="scrap-surge/privacy.html">Privacy policy</a>
      <a href="mailto:flouloxstudios@gmail.com">Support</a>
    </div>
  </section>
  <footer>Contact: <a href="mailto:flouloxstudios@gmail.com">flouloxstudios@gmail.com</a></footer>
</main>
</body>
</html>
